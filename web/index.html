<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plymouth Logo</title><link rel="icon" href="/icon.png" type="image/png"><link rel="stylesheet" href="/style.css"><script defer src="/i18n.js"></script><script defer src="/animations.js"></script><script defer src="/app.js"></script></head>
<body><main><header><div class="mark">◉</div><div><small>BOOT APPEARANCE</small><h1>Plymouth Logo</h1></div><span id="kernel" data-i18n="연결 중">연결 중</span><select id="language" aria-label="언어" data-i18n-aria-label="언어"><option value="ko">한국어</option><option value="en">English</option></select></header>
<div class="preset-bar"><label for="preset" data-i18n="프리셋">프리셋</label><select id="preset"><option value="" data-i18n="직접 편집">직접 편집</option></select><span id="presetDescription" data-i18n="선택 후 오른쪽 미리보기에서 확인하세요">선택 후 오른쪽 미리보기에서 확인하세요</span><div class="background-control"><label for="backgroundColor" data-i18n="배경색">배경색</label><input id="backgroundColor" type="color" value="#000000" aria-label="배경색 선택" data-i18n-aria-label="배경색 선택"><input id="backgroundHex" type="text" value="#000000" maxlength="7" spellcheck="false" aria-label="배경색 HEX 코드" data-i18n-aria-label="배경색 HEX 코드" placeholder="#000000"></div></div>
<section class="comparison">
<article><div class="panel-title"><select id="previewSource" aria-label="미리보기 대상" data-i18n-aria-label="미리보기 대상"><option value="current" data-i18n="현재 적용">현재 적용</option><option value="default" data-i18n="시스템 기본 테마 (참고)">시스템 기본 테마 (참고)</option></select><span id="currentSize" data-i18n="확인 중">확인 중</span></div><div class="screen" id="currentScreen"><img id="currentLogo" alt="현재 적용된 로고" data-i18n-alt="현재 적용된 로고"><div id="systemLayers"></div><div id="currentLayers" class="animation-layers"></div><span id="currentEmpty" data-i18n="현재 설정을 읽는 중…">현재 설정을 읽는 중…</span><div class="spinner" id="currentSpinner"></div><img id="currentAnimation" class="spinner-animation" alt="현재 스피너" data-i18n-alt="현재 스피너"></div><p id="currentPreviewNote" class="preview-note"></p></article>
<article><div class="panel-title"><strong data-i18n="변경 미리보기">변경 미리보기</strong><span data-i18n="적용 전">적용 전</span></div><div class="screen" id="draftScreen"><div id="draftLayers" class="animation-layers"></div></div></article>
</section>
<div class="caption"><span data-i18n="일반 부팅 화면 미리보기">일반 부팅 화면 미리보기</span><span data-i18n="1920 × 1080 기준 미리보기">1920 × 1080 기준 미리보기</span></div>
<section class="animation-editor">
<div class="animation-toolbar"><label for="animationLayer" data-i18n="레이어">레이어</label><select id="animationLayer"></select><span id="animationCount">0 / 16</span><button id="addImage" class="secondary" data-i18n="이미지 추가">이미지 추가</button><button id="addAnimation" class="secondary" data-i18n="애니메이션 추가">애니메이션 추가</button><button id="replaceImage" class="secondary" data-i18n="이미지 교체">이미지 교체</button><button id="removeAnimation" class="secondary" data-i18n="삭제">삭제</button><button id="animationBack" class="secondary" data-i18n="뒤로">뒤로</button><button id="animationFront" class="secondary" data-i18n="앞으로">앞으로</button></div>
<input id="file" type="file" accept="image/png,image/jpeg" multiple hidden><input id="replaceFile" type="file" accept="image/png,image/jpeg" hidden><div class="animation-settings"><label id="animationType" class="spinner-item-label" for="spinnerItem"><span data-i18n="스피너">스피너</span> <select id="spinnerItem"><option value="default" data-i18n="기본 회전">기본 회전</option></select></label><label class="spinner-size-label" for="spinnerSize"><span data-i18n="크기">크기</span> <output id="spinnerSizeValue">32 px</output></label><input id="spinnerSize" type="range" min="32" max="320" step="1" value="32"><div class="spinner-controls"><label><span data-i18n="좌우">좌우</span> <output id="spinnerXValue">50%</output><input id="spinnerX" type="range" min="0" max="100" value="50"></label><label><span data-i18n="상하">상하</span> <output id="spinnerYValue">70%</output><input id="spinnerY" type="range" min="0" max="100" value="70"></label></div><label id="fpsControl" class="fps-control" for="animationFPS"><span data-i18n="재생 속도">재생 속도</span><input id="animationFPS" type="number" min="1" max="60" step="any" value="15"> FPS</label></div>
<div class="animation-summary"><span data-i18n="목록 아래 항목이 앞에 표시됩니다.">목록 아래 항목이 앞에 표시됩니다.</span><span id="animationMemory"></span></div><p id="animationStatus" role="status"></p>
</section>
<section class="scene-actions"><div><div class="buttons"><button disabled id="apply" data-i18n="화면 적용">화면 적용</button><button disabled id="restore" class="secondary" data-i18n="직전 복원">직전 복원</button><button disabled id="original" class="secondary" data-i18n="원본 복원">원본 복원</button></div><p class="hint" data-i18n="관리자 인증 후 적용 · 재부팅 시 반영">관리자 인증 후 적용 · 재부팅 시 반영</p></div>
</section>
<p id="hostStatus" class="hint" data-i18n="적용 환경 확인 중…">적용 환경 확인 중…</p>
<section class="status"><span id="dot">●</span><pre id="status" data-i18n="연결 중…">연결 중…</pre></section><footer data-i18n="일반 부팅 화면만 변경합니다. 커널 시험용 슬롯과 U-Boot 로고는 유지됩니다.">일반 부팅 화면만 변경합니다. 커널 시험용 슬롯과 U-Boot 로고는 유지됩니다.</footer></main></body></html>
